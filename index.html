<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Calculator App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 id="title" style="font-family: consolas;">A Calculator App</h1>
    <div id='calculator'>
        <div id='display'>0</div>
        <div id='buttons'>
            <div id="'rowone">
                <button class="digit">DEL</button>
                <button data-value='' disabled>&nbsp</button>
                <button data-value='' disabled>&nbsp</button>
                <button class="operator" id='divButton'>/</button>
            </div>
            <div id='rowtwo'>
                <button class ='digit' data-value='7'>7</button>
                <button class ='digit' data-value='8'>8</button>
                <button class ='digit' data-value='9'>9</button>
                <button class="operator" id='multiButton'>*</button>
            </div>
            <div id="'rowthree">
                <button class ='digit' data-value='4'>4</button>
                <button class ='digit' data-value='5'>5</button>
                <button class ='digit' data-value='6'>6</button>
                <button class="operator" id='minusButton'>-</button>
            </div>
            <div id="rowfour">
                <button class ='digit' data-value='1'>1</button>
                <button class ='digit' data-value='2'>2</button>
                <button class ='digit' data-value='3'>3</button>
                <button class="operator" id='plusButton'>+</button>
            </div>
            <div id="rowfive">
                <button data-value='C'>C</button>
                <button class ='digit' data-value='0'>0</button>
                <button class ='digit' data-value='.'>.</button>
                <button class="operator" id='equalsButton'>=</button>
            </div>
        </div>
    </div>
</body>

</html>
